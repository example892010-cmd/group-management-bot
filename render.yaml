services:
  - type: web
    name: aniflix-group-management-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: DATABASE_PATH
        value: ./data/aniflix_group_management.db
      - key: BOT_CHANNEL_USERNAME
        value: '@ANIFLIXANIMETAMIL'
